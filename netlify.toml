# ── Netlify Configuration ─────────────────────────────────────────────────────

[build]
  # Dossier source
  base = "."
  # Commande de build
  command = "npm run build"
  # Dossier de sortie à déployer
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Redirections SPA (React Router) ──────────────────────────────────────────
# Toutes les URLs renvoient vers index.html (nécessaire pour les PWA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Headers de sécurité & performance ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache long pour les assets buildés (hash dans le nom)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pas de cache pour le service worker (pour les mises à jour immédiates)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Pas de cache pour le manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
